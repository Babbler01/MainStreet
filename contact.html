<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MainStreet Barbers</title>
    <link rel="icon" href="img/msfavicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Page Title -->
    <div class="d-flex page-top">
        <h1 class="display-1">Get in Touch</h1>
    </div>
    

    <!-- Contact Information -->

    <div class="contact-info py-5">
        <div class="container ms-pad">

            <div class="row g-4">

            <div class="col-12 col-md-4">
                <div class="about-feature h-100">
                <i class="bi bi-geo-alt"></i>
                <h3>Visit Us</h3>
                <p>Lagos, Nigeria</p>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="about-feature h-100">
                <i class="bi bi-telephone"></i>
                <h3>Call Us</h3>
                <p>+2348 123 456 7890/p>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="about-feature h-100">
                <i class="bi bi-envelope"></i>
                <h3>Email Us</h3>
                <p>hello@mainstreet.com</p>
                </div>
            </div>

            </div>

        </div>
    </div>



    <!-- Contact Form -->

    <div class="container ms-pad">
        <div>
            <h2 class="display-3 text-center"> Send us a <span>Message</span></h2>
        </div>

        <div class="row g-4 form">

            <div class="col-12 col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name">
            </div>

            <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email">
            </div>

            <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone">
            </div>

            <div class="col-12 col-md-6">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" class="form-control" id="subject">
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="6"></textarea>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-main">
                Send Message
                </button>
            </div>

        </div>
    </div>

    
    <!-- Footer -->
    <div id="footer"></div>

    
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
    <script src="js/footer.js"></script>

</body>
</html>
